name: Auto Refresh Mercado Livre Tokens

on:
  schedule:
    # Executa a cada 2 horas para garantir que nenhum token expire
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  refresh-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Proactive Token Refresh
        run: |
          curl -f -s -X POST "https://lojafy-supabase.d2x.site/functions/v1/ml-token-refresh" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg1NDU5NzI2LCJleHAiOjE5NDMxMzk3MjZ9.pcQQhBGEAgKG8sUtKiz00OBp09yA7NW0yPCqjiq-_sE" \
            -d '{"mode": "refresh_all_expiring"}'
