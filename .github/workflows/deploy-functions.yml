name: Deploy Edge Functions to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy functions to VPS via Rsync
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no" supabase/functions/ root@148.230.78.81:/opt/supabase-lojafy/volumes/functions/

      - name: Restart functions container
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no root@148.230.78.81 "docker restart lojafy-functions-1"
