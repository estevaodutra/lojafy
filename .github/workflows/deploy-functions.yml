name: Deploy Edge Functions to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/20261126120000_primary_order_flow.sql'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Apply primary order flow migration
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -p 22022 -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd /root/supabase-lojafy && docker compose exec -T db psql -U postgres -d postgres --single-transaction -v ON_ERROR_STOP=1 -f -' \
            < supabase/migrations/20261126120000_primary_order_flow.sql
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -p 22022 -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /root/supabase-lojafy && docker compose exec -T db psql -U postgres -d postgres -c \"NOTIFY pgrst, 'reload schema';\""

      - name: Copy functions to VPS via Rsync
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz -e "ssh -p 22022 -o StrictHostKeyChecking=no" supabase/functions/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/supabase-lojafy/volumes/functions/

      - name: Restart functions container
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -p 22022 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /root/supabase-lojafy && (docker compose restart functions || docker-compose restart functions)"
